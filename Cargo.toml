[package]
name = "iced-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A shadcn/ui-flavored component library and design system for iced, porting the gpui-kit visual language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sungaoyong/iced-kit"
keywords = ["iced", "gui", "widgets", "components", "design-system"]
categories = ["gui"]
# Ship the sources, the bundled tab-strip icons, and the documentation that
# explains the licensing. Everything else at the repository root is development
# scaffolding.
#
# The icon font is not listed here: it comes from the `lucide-icons`
# dependency, whose `lucide.ttf` is embedded by the compiler rather than read
# from this package.
include = [
    "src/**/*.rs",
    "assets/*.svg",
    "examples/*.rs",
    "tests/*.rs",
    "tests/dock/*.rs",
    "tests/snapshots/*.png",
    "locales/**/*.ftl",
    "Cargo.toml",
    "README.md",
    "THEMING.md",
    "PUBLISHING.md",
    "NOTICE",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
# Docking layout: draggable tabs, resizable splits, drag-and-drop docking,
# collapsible edge docks and panel zoom.
dock = ["dep:thiserror"]

# Serialization of dock layouts.
dock-serde = ["dock", "dep:serde"]

# Internationalization: Translator trait, I18n context, and tr! macro.
# Pulls in fluent-bundle as a stable argument type for translate_fmt,
# but the FluentTranslator backend requires `i18n-fluent`.
i18n = ["dep:fluent-bundle"]

# Fluent (.ftl) backend for i18n, powered by the fluent-bundle crate.
i18n-fluent = ["i18n", "dep:thiserror"]

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "canvas", "markdown", "svg"] }
# Icon font and name enum only. The crate's own `iced` feature is deliberately
# off: it generates a named function per icon, which the `From` conversions here
# make unnecessary.
lucide-icons = { version = "1.31", default-features = false }
thiserror = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
# Pulled in by the `i18n` feature so `Translator::translate_fmt` can use
# `FluentValue` as a stable argument type. Enable `i18n-fluent` for the
# `FluentTranslator` backend.
fluent-bundle = { version = "0.16", optional = true }

# The dock example only compiles with the `dock` feature, and without this
# entry `cargo test` — which builds examples — would fail in a default build.
[[example]]
name = "dock"
required-features = ["dock"]

# The main_window example uses i18n with the Fluent backend.
[[example]]
name = "main_window"
required-features = ["i18n-fluent"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Tests assert that a value passes through arithmetic unchanged, which is
# exactly the case `float_cmp` warns about.
float_cmp = "allow"

[dev-dependencies]
iced_test = "0.14"
serde_json = "1.0"
# Reads back the PNGs `iced_test` writes, so a test can measure where a
# component actually landed in the frame rather than only that it rendered.
png = "0.17"

# Each dock test needs an explicit target: cargo does not auto-discover tests
# in subdirectories, and all of them require the `dock` feature.

[[test]]
name = "dock_builder"
path = "tests/dock/builder.rs"
required-features = ["dock"]

[[test]]
name = "dock_layout_dirty"
path = "tests/dock/dock_update_layout_dirty.rs"
required-features = ["dock"]

[[test]]
name = "dock_event_no_double_apply"
path = "tests/dock/event_no_double_apply.rs"
required-features = ["dock"]

[[test]]
name = "dock_factory_split"
path = "tests/dock/factory_split.rs"
required-features = ["dock"]

[[test]]
name = "dock_factory_tabs"
path = "tests/dock/factory_tabs.rs"
required-features = ["dock"]

[[test]]
name = "dock_focus"
path = "tests/dock/focus.rs"
required-features = ["dock"]

[[test]]
name = "dock_layout_seed"
path = "tests/dock/layout_seed.rs"
required-features = ["dock"]

[[test]]
name = "dock_manager"
path = "tests/dock/manager_dock.rs"
required-features = ["dock"]

[[test]]
name = "dock_simulator"
path = "tests/dock/simulator.rs"
required-features = ["dock"]

[[test]]
name = "dock_style"
path = "tests/dock/style.rs"
required-features = ["dock"]

[[test]]
name = "dock_tab_switch_layout_sync"
path = "tests/dock/tab_switch_layout_sync.rs"
required-features = ["dock"]

[[test]]
name = "dock_serde_roundtrip"
path = "tests/dock/serde_roundtrip.rs"
required-features = ["dock-serde"]

[[test]]
name = "dock_regions"
path = "tests/dock/regions.rs"
required-features = ["dock"]

[[test]]
name = "dock_cross_tree"
path = "tests/dock/cross_tree.rs"
required-features = ["dock"]

[[test]]
name = "dock_drag"
path = "tests/dock/drag.rs"
required-features = ["dock"]

[[test]]
name = "dock_example_workspace"
path = "tests/dock/example_workspace.rs"
required-features = ["dock"]

[[test]]
name = "dock_runtime_drag"
path = "tests/dock/runtime_drag.rs"
required-features = ["dock"]

[[test]]
name = "dock_app_runtime"
path = "tests/dock/app_runtime.rs"
required-features = ["dock"]
